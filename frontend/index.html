<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Network Anomaly Detector</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background:#0f1115; color:#e6e6e6;}
  h1 { font-size: 1.4rem; }
  .upload-box { border: 2px dashed #444; border-radius: 10px; padding: 30px; text-align: center; margin: 20px 0; }
  input[type=file] { color: #e6e6e6; }
  button { background:#4f8cff; color:white; border:none; padding:10px 18px; border-radius:6px; cursor:pointer; font-size:1rem; margin-top:10px;}
  button:disabled { background:#333; cursor:not-allowed; }
  table { width:100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
  th, td { border-bottom: 1px solid #2a2d34; padding: 8px 10px; text-align: left; }
  th { color:#9aa4b2; text-transform: uppercase; font-size:0.75rem; }
  tr.anomaly { background: rgba(255, 70, 70, 0.15); }
  tr.anomaly td:last-child { color:#ff6b6b; font-weight:600; }
  tr.normal td:last-child { color:#6bff9e; font-weight:600; }
  #status { margin-top: 10px; color:#9aa4b2; }
  #summary { margin-top: 16px; font-size: 0.95rem; }
</style>
</head>
<body>
  <h1>🔍 Network Anomaly Detector</h1>
  <p>Upload a <code>.pcap</code> / <code>.pcapng</code> file (e.g. captured with Wireshark). Traffic is aggregated into flows and each flow is run through the anomaly model.</p>

  <div class="upload-box">
    <input type="file" id="pcapFile" accept=".pcap,.pcapng" />
    <br>
    <button id="analyzeBtn">Analyze</button>
  </div>

  <div id="status"></div>
  <div id="summary"></div>
  <table id="resultsTable" style="display:none;">
    <thead>
      <tr>
        <th>Src IP</th><th>Dst IP</th><th>Port</th><th>Proto</th><th>Service</th>
        <th>Duration</th><th>Bytes Sent</th><th>Bytes Recv</th><th>Flag</th><th>Result</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>

  <script>
    const API_URL = "http://localhost:8000/analyze"; // change if backend is hosted elsewhere

    const btn = document.getElementById("analyzeBtn");
    const fileInput = document.getElementById("pcapFile");
    const status = document.getElementById("status");
    const summary = document.getElementById("summary");
    const table = document.getElementById("resultsTable");
    const tbody = document.getElementById("resultsBody");

    btn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) { status.textContent = "Please choose a pcap file first."; return; }

      btn.disabled = true;
      status.textContent = "Uploading and analyzing…";
      summary.textContent = "";
      table.style.display = "none";
      tbody.innerHTML = "";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(API_URL, { method: "POST", body: formData });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server returned ${res.status}`);
        }
        const data = await res.json();
        renderResults(data.flows || []);
      } catch (e) {
        status.textContent = "Error: " + e.message + " (is the backend running on " + API_URL + "?)";
      } finally {
        btn.disabled = false;
      }
    });

    function renderResults(flows) {
      if (flows.length === 0) {
        status.textContent = "No flows found in this capture.";
        return;
      }
      status.textContent = `Analyzed ${flows.length} flow(s).`;
      const anomalies = flows.filter(f => f.prediction === "anomaly").length;
      summary.textContent = `⚠️ ${anomalies} anomaly flow(s) out of ${flows.length}.`;

      for (const f of flows) {
        const tr = document.createElement("tr");
        tr.className = f.prediction === "anomaly" ? "anomaly" : "normal";
        tr.innerHTML = `
          <td>${f.src_ip}</td>
          <td>${f.dst_ip}</td>
          <td>${f.port}</td>
          <td>${f.protocol_type}</td>
          <td>${f.service}</td>
          <td>${f.duration}</td>
          <td>${f.bytes_sent}</td>
          <td>${f.bytes_received}</td>
          <td>${f.flag}</td>
          <td>${f.prediction.toUpperCase()}</td>
        `;
        tbody.appendChild(tr);
      }
      table.style.display = "table";
    }
  </script>
</body>
</html>
